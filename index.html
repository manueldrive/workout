<style>
/* Layout: one-exercise-at-a-time logbook. Plate strip on top, motion + cues side by side, set table, rest bar pinned to the bottom. */
:root{
  --bg:#eef0f3; --surface:#ffffff; --sunk:#e3e6eb; --ink:#161a22; --muted:#5d6574; --line:#cfd4dc;
  --accent:#2a55d9; --accent-ink:#ffffff; --done:#1f8a52; --done-soft:#dcf0e4; --rest:#f2b705; --rest-ink:#1b1600;
  --fig-near:#161a22; --fig-far:#9aa3b2; --prop:#2a55d9;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151b; --surface:#1b2029; --sunk:#232935; --ink:#e9ecf2; --muted:#9aa3b3; --line:#323a48;
  --accent:#6e92ff; --accent-ink:#0b1430; --done:#4cc985; --done-soft:#17352a; --rest:#f5c534; --rest-ink:#1b1600;
  --fig-near:#e9ecf2; --fig-far:#5b6577; --prop:#6e92ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --surface:#1b2029; --sunk:#232935; --ink:#e9ecf2; --muted:#9aa3b3; --line:#323a48;
  --accent:#6e92ff; --accent-ink:#0b1430; --done:#4cc985; --done-soft:#17352a; --rest:#f5c534; --rest-ink:#1b1600;
  --fig-near:#e9ecf2; --fig-far:#5b6577; --prop:#6e92ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:2.3rem;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.sub a{color:var(--accent)}
.restpick,.daypick{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.restpick button,.daypick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-weight:600;font-variant-numeric:tabular-nums}
.restpick button[aria-pressed="true"],.daypick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.hdr-r{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.daypick button{font-family:var(--display);font-size:1rem;letter-spacing:.04em;text-transform:uppercase;padding:4px 14px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.chip{border:0;background:var(--surface);border-radius:10px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.chip b{font-family:var(--display);font-size:1.25rem;line-height:1}
.chip small{font-size:.66rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-transform:uppercase;letter-spacing:.04em}
.chip[aria-current="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.chip[aria-current="true"] small{color:var(--accent-ink);opacity:.85}
.chip.done{box-shadow:inset 0 0 0 2px var(--done)}
.chip.done b::after{content:" ✓";color:var(--done);font-size:.9rem}
.chip[aria-current="true"].done b::after{color:var(--accent-ink)}

.extitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
h2{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1.05;margin:0;text-wrap:balance}
.rx{font-family:var(--display);font-weight:600;font-size:1.15rem;color:var(--muted);letter-spacing:.02em}
.rx b{color:var(--ink)}

.demo{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}
@media (max-width:600px){.demo{grid-template-columns:1fr}}
.stage{background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);position:relative;overflow:hidden;min-width:0}
canvas{display:block;width:100%;aspect-ratio:4/3;max-width:100%}
.vid{display:none;position:relative;width:100%;aspect-ratio:16/9;background:#000}
.vid iframe,.vid>div{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.stage.has-vid .vid{display:block}
.stage.has-vid canvas{display:none}
.stagebar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.stagebar>*{pointer-events:auto}
.pill{border:0;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;background:var(--sunk);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pill.primary{background:var(--accent);color:var(--accent-ink)}
.tips{background:var(--sunk);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tips h3{font-family:var(--display);font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--muted);font-weight:700}
.tips ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.tips li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}
.feel,.avoid{font-size:.92rem;margin:0}
.feel b,.avoid b{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-size:.85rem;margin-right:4px}
.avoid b{color:#c2410c}
.tempo{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

.log{background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);padding:6px 0 10px}
.row{display:grid;grid-template-columns:40px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center;padding:6px 12px}
.row.head{font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-block:8px 4px}
.row .n{font-family:var(--display);font-weight:700;font-size:1.25rem;text-align:center}
.row .prev{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 8px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:1.05rem}
.row input::placeholder{color:var(--muted);font-weight:500;opacity:.8}
.tick{width:44px;height:40px;border-radius:10px;border:2px solid var(--line);background:transparent;font-size:1.1rem;font-weight:800;color:var(--muted)}
.row.isdone{background:var(--done-soft)}
.row.isdone .tick{background:var(--done);border-color:var(--done);color:#fff}
.row.isdone input{border-color:transparent;background:transparent}
.logfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px 0;flex-wrap:wrap}
.ghost{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 14px;font-weight:600}
.saved{font-size:.8rem;color:var(--muted)}

.nav{display:flex;justify-content:space-between;gap:10px}
.nav button{flex:1;border:0;border-radius:12px;padding:14px;font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.nav button.next{background:var(--ink);color:var(--bg);box-shadow:none}
.nav button:disabled{opacity:.35;cursor:default}

.restbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--rest);color:var(--rest-ink);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px;box-shadow:0 -6px 24px rgba(0,0,0,.18);transform:translateY(110%);transition:transform .25s ease}
.restbar.on{transform:none}
.restbar .lbl{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;line-height:1.1}
.restbar .t{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums;min-width:3.2ch}
.restbar .prog{flex:1;height:8px;border-radius:99px;background:rgba(0,0,0,.15);overflow:hidden;min-width:40px}
.restbar .prog i{display:block;height:100%;background:var(--rest-ink);width:100%;transform-origin:left}
.restbar button{border:0;border-radius:10px;padding:9px 11px;font-weight:700;background:rgba(0,0,0,.12);color:var(--rest-ink);font-variant-numeric:tabular-nums}
.restbar.over{background:var(--done);color:#fff}
.restbar.over button{color:#fff;background:rgba(255,255,255,.2)}
.restbar.over .prog i{background:#fff}
@media (prefers-reduced-motion: reduce){.restbar{transition:none}}
</style>

</div>

</div>

// ---------- Storage: private per-viewer db, local fallback ----------
const store={db:null,col:null,mode:"local",
  async init(){
    try{
      if(!window.claude||!window.claude.use) return;

      if(!db||!user) return;

    }catch(e){}
  },
  async loadAll(){
    if(this.mode==="db"){
      try{const q=await this.col.get(); const out=[]; let settings=null;
        q.docs.forEach(d=>{ if(d.id.startsWith("s-")) out.push(d.data()); else if(d.id==="settings") settings=d.data(); });

      }catch(e){}

  },
  async save(s){

};

}

}

// ---------- Rest timer ----------
let actx=null;
function unlockAudio(){ try{ if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); } if(actx&&actx.state==="suspended") actx.resume(); }catch(e){} wake(); }

  o.connect(g).connect(actx.destination); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+.2); }); }catch(e){} }
const timer={end:0,total:0,iv:null,
  start(sec,label){ this.total=sec; this.end=Date.now()+sec*1000; $("restlbl").textContent=label; $("restbar").classList.add("on"); $("restbar").classList.remove("over"); this.fired=false; clearInterval(this.iv); this.iv=setInterval(()=>this.tick(),200); this.tick(); },
  add(s){ if(!this.iv) return; this.end+=s*1000; this.total=Math.max(this.total+s,1); if(this.end>Date.now()){ $("restbar").classList.remove("over"); this.fired=false; } this.tick(); },
  stop(){ clearInterval(this.iv); this.iv=null; $("restbar").classList.remove("on","over"); },
  tick(){ const left=Math.round((this.end-Date.now())/1000);
    const a=Math.abs(left); $("restt").textContent=(left<0?"+":"")+Math.floor(a/60)+":"+pad(a%60);
    $("restprog").style.transform="scaleX("+Math.max(0,Math.min(1,left/this.total))+")";

$("rminus").onclick=()=>timer.add(-15); $("rplus").onclick=()=>timer.add(15); $("rskip").onclick=()=>timer.stop();

// ---------- Motion demo ----------
const cv=$("cv"), ctx=cv.getContext("2d");
const T=60, TH=45, SH=45, UA=30, FA=28, HEAD=11;
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function ik(a,c,l1,l2,pref){
  let dx=c[0]-a[0], dy=c[1]-a[1], d=Math.hypot(dx,dy); const max=l1+l2-0.5; if(d>max){ d=max; } if(d<1) d=1;
  const base=Math.atan2(dy,dx), ang=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))));
  const k1=[a[0]+l1*Math.cos(base+ang),a[1]+l1*Math.sin(base+ang)], k2=[a[0]+l1*Math.cos(base-ang),a[1]+l1*Math.sin(base-ang)];
  const s1=(k1[0]-a[0])*pref[0]+(k1[1]-a[1])*pref[1], s2=(k2[0]-a[0])*pref[0]+(k2[1]-a[1])*pref[1];
  return s1>=s2?k1:k2;
}
const lerp=(a,b,t)=>a+(b-a)*t, lp=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
function resolve(k){
  const sh=[k.hip[0]+T*Math.cos(k.ta*Math.PI/180),k.hip[1]+T*Math.sin(k.ta*Math.PI/180)];
  return {hip:k.hip,ta:k.ta,sh,fL:k.fL,fR:k.fR,hL:k.hLr?[sh[0]+k.hLr[0],sh[1]+k.hLr[1]]:k.hL,hR:k.hRr?[sh[0]+k.hRr[0],sh[1]+k.hRr[1]]:k.hR,kpo:k.kpo};
}
function blend(A,B,t){
  const ta=lerp(A.ta,B.ta,t), hip=lp(A.hip,B.hip,t);
  const sh=[hip[0]+T*Math.cos(ta*Math.PI/180),hip[1]+T*Math.sin(ta*Math.PI/180)];
  return {hip,sh,fL:lp(A.fL,B.fL,t),fR:lp(A.fR,B.fR,t),hL:lp(A.hL,B.hL,t),hR:lp(A.hR,B.hR,t),kpo:t<.5?A.kpo:B.kpo};
}
const anim={ex:null,raf:0,t0:0,paused:false,pt:0,
  start(e){ this.ex=e; this.keys=e.keys?e.keys.map(resolve):null; this.t0=performance.now(); this.pt=0; cancelAnimationFrame(this.raf); this.loop(); },
  stop(){ cancelAnimationFrame(this.raf); },
  loop(){ const now=performance.now(); const el=this.paused?this.pt:(now-this.t0); this.draw(el/1000); if(!this.paused) this.raf=requestAnimationFrame(()=>this.loop()); },
  pose(sec){ const seq=this.ex.seq, seg=1.15, hold=0.35, per=seg+hold, n=seq.length, tt=sec%(per*n), i=Math.floor(tt/per), f=tt-i*per;
    const A=this.keys[seq[i]], B=this.keys[seq[(i+1)%n]]; const u=f<hold?0:(f-hold)/seg; const e=0.5-0.5*Math.cos(Math.PI*u); return blend(A,B,e); },
  draw(sec){
    const e=this.ex, dpr=Math.min(window.devicePixelRatio||1,2), W=cv.clientWidth||640, H=W*0.75;
    if(cv.width!==Math.round(W*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    if(!this.keys){ // no figure for this exercise: point at the video instead
      ctx.fillStyle=css("--muted"); ctx.textAlign="center"; ctx.font="600 "+Math.max(15,W/26)+"px "+css("--body");
      ctx.fillText("Demo video unavailable",W/2,H/2-14); ctx.fillText("Tap ▶ Full video to watch",W/2,H/2+14); ctx.textAlign="start";
      cancelAnimationFrame(this.raf); return;
    }
    const [x0,x1,y0,y1]=e.vb, padB=44, s=Math.min((W-24)/(x1-x0),(H-padB-16)/(y1-y0));
    const ox=(W-(x1-x0)*s)/2-x0*s, oy=16+(y1-y0)*s+ (H-padB-16-(y1-y0)*s)/2 + y0*s;
    const X=p=>ox+p[0]*s, Y=p=>oy-p[1]*s;
    const near=css("--fig-near"), far=css("--fig-far"), prop=css("--prop"), line=css("--line"), sunk=css("--sunk");
    // ground
    ctx.strokeStyle=line; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(8,Y([0,0])); ctx.lineTo(W-8,Y([0,0])); ctx.stroke();

    const lw=Math.max(5,s*7.5);
    const seg=(pts,col,w)=>{ ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.beginPath(); ctx.moveTo(X(pts[0]),Y(pts[0])); for(let i=1;i<pts.length;i++) ctx.lineTo(X(pts[i]),Y(pts[i])); ctx.stroke(); };
    const dbH=(p,col)=>{ ctx.fillStyle=col; const w=26*s, h=9*s; ctx.fillRect(X(p)-w/2,Y(p)-h/2+h*.2,w,h*.6); ctx.fillRect(X(p)-w/2-2,Y(p)-h,w*.28,h*2); ctx.fillRect(X(p)+w/2-w*.28+2,Y(p)-h,w*.28,h*2); };
    // props behind
    if(e.props.includes("mat")){ ctx.fillStyle=sunk; ctx.fillRect(X([x0+6,0]),Y([0,3]),(x1-x0-12)*s,3*s); }
    if(e.props.includes("bench")){ ctx.fillStyle=sunk; ctx.fillRect(X([0,40]),Y([0,40]),58*s,7*s); ctx.fillRect(X([8,33]),Y([0,33]),6*s,33*s); ctx.fillRect(X([44,33]),Y([0,33]),6*s,33*s); }
    if(e.props.includes("pole-back")){ seg([[136,0],[136,172]],line,Math.max(4,s*6)); }
    if(e.props.includes("pole-front")){ seg([[-10,0],[-10,40]],line,Math.max(4,s*6)); }

    if(e.props.includes("db-hang-L")) dbH(P.hL,far);
    // torso + head
    const dir=[(P.sh[0]-P.hip[0])/T,(P.sh[1]-P.hip[1])/T], hc=[P.sh[0]+dir[0]*(HEAD+6),P.sh[1]+dir[1]*(HEAD+6)];
    seg([P.hip,P.sh],near,lw*1.5);
    ctx.fillStyle=near; ctx.beginPath(); ctx.arc(X(hc),Y(hc),HEAD*s,0,Math.PI*2); ctx.fill();
    // near side
    seg([P.hip,kR,P.fR],near,lw);
    if(e.props.includes("db-goblet")){ const m=lp(P.hL,P.hR,.5); ctx.fillStyle=prop; ctx.fillRect(X(m)-5*s,Y(m)-14*s,10*s,28*s); ctx.fillRect(X(m)-9*s,Y(m)-17*s,18*s,6*s); ctx.fillRect(X(m)-9*s,Y(m)+11*s,18*s,6*s); }
    seg([P.sh,eR,P.hR],near,lw*.85);
    if(e.props.includes("db-hang-R")) dbH(P.hR,prop);
    if(e.props.includes("db-hang-L")&&!e.props.includes("db-hang-R")) dbH(P.hL,prop);
    // feet
    ctx.fillStyle=near; [P.fR].forEach(f=>{ ctx.beginPath(); ctx.ellipse(X(f)+3*s,Y(f),7*s,3.2*s,0,0,Math.PI*2); ctx.fill(); });
  }
};
$("pause").onclick=()=>{
  if(yt.on()){ yt.paused=!yt.paused; yt.paused?yt.player.pauseVideo():yt.player.playVideo(); $("pause").textContent=yt.paused?"Play":"Pause"; return; }
  anim.paused=!anim.paused; $("pause").textContent=anim.paused?"Play":"Pause";
  if(anim.paused){ anim.pt=performance.now()-anim.t0; cancelAnimationFrame(anim.raf); } else { anim.t0=performance.now()-anim.pt; anim.loop(); } };
window.addEventListener("resize",()=>{ if(anim.paused) anim.draw(anim.pt/1000); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(anim.paused) anim.draw(anim.pt/1000); });

// ---------- YouTube demo: loops e.s..e.e of the real video; any failure falls back to the canvas figure ----------
const yt={api:null,player:null,ready:false,failed:false,playing:false,paused:false,ex:null,to:0,
  on(){ return $("stage").classList.contains("has-vid")&&this.ready; },
  load(){
    if(!this.api) this.api=new Promise((res,rej)=>{
      if(window.YT&&window.YT.Player) return res();
      window.onYouTubeIframeAPIReady=res;
      const s=document.createElement("script"); s.src="https://www.youtube.com/iframe_api"; s.onerror=rej; document.head.appendChild(s);
      setTimeout(rej,8000);
    });
    return this.api;
  },
  show(e){
    this.ex=e; this.playing=false; this.paused=false; clearTimeout(this.to);
    if(!e.yt||this.failed){ this.off(); return false; }
    $("stage").classList.add("has-vid"); anim.stop();
    this.load().then(()=>{
      if(this.ex!==e) return;
      if(!this.player) this.player=new window.YT.Player("ytp",{videoId:e.yt,
        playerVars:{autoplay:1,mute:1,controls:0,playsinline:1,rel:0,disablekb:1,fs:0,iv_load_policy:3,start:Math.floor(e.s)},
        events:{onReady:ev=>{ this.ready=true; ev.target.mute(); this.cue(); },
                onStateChange:ev=>this.state(ev.data), onError:()=>this.fail()}});
      else if(this.ready) this.cue();
    }).catch(()=>this.fail());
    this.to=setTimeout(()=>{ if(!this.playing&&this.ex===e) this.fail(); },12000);
    return true;
  },
  cue(){ const e=this.ex; if(!e||!e.yt||this.failed) return; this.player.loadVideoById({videoId:e.yt,startSeconds:e.s}); this.player.mute(); },
  state(d){
    if(d===window.YT.PlayerState.PLAYING){ this.playing=true; clearTimeout(this.to); try{ this.player.unloadModule("captions"); }catch(e){} }
    if(d===window.YT.PlayerState.ENDED&&this.ex){ this.player.seekTo(this.ex.s,true); this.player.playVideo(); }
  },
  tick(){
    if(!this.on()||this.paused||!this.ex||document.hidden) return;
    const st=this.player.getPlayerState();
    if(st===window.YT.PlayerState.PAUSED||st===window.YT.PlayerState.CUED){ this.player.playVideo(); return; }
    const t=this.player.getCurrentTime();
    if(t>=this.ex.e||t<this.ex.s-1) this.player.seekTo(this.ex.s,true);
  },
  off(){ $("stage").classList.remove("has-vid"); if(this.ready) this.player.pauseVideo(); },
  fail(){ if(this.failed) return; this.failed=true; clearTimeout(this.to); this.off(); anim.start(EX[cur]); $("pause").textContent=anim.paused?"Play":"Pause"; }
};
setInterval(()=>yt.tick(),150);
